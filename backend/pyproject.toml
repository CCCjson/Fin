[tool.mypy]
python_version = "3.10"
# 全局严：将来引入的新依赖若缺 stub 会主动暴露，逼你在下面显式登记
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
# 全局松：存量 ~75-80% 注解率，不强制全量注解，否则无法落地
disallow_untyped_defs = false
check_untyped_defs = false

# 无类型 stub 的第三方库，局部放行缺 import
[[tool.mypy.overrides]]
module = [
  "akshare.*", "yfinance.*", "pytdx.*", "curl_cffi.*", "tushare.*", "finnhub.*",
  "pandas.*", "numpy.*", "sqlalchemy_utils.*", "sqlite_vec.*",
  "trafilatura.*", "fitz.*", "playwright.*", "sentence_transformers.*",
  "apscheduler.*", "ta.*", "backtrader.*", "vectorbt.*",
  # requests 其实有官方 stub（types-requests），装上就能从这儿摘掉
  "requests.*",
]
ignore_missing_imports = true

# ── mypy 强检名单（只增不减）────────────────────────────────────────────
# 迁完一个域，就把该域的模块 glob 追加进 module 列表，跑到绿再 commit。
# 与 ruff 的豁免表方向相反：ruff 白名单只减、mypy 名单只增，
# 二者共同表达「严格面单调扩张」。
[[tool.mypy.overrides]]
module = [
  "common.market",
  "common.limit_rules",
  "common.scoring_utils",
  "common.db",
  "net.clash",
  "net.env",
  "net.session",
  "net.proxy_pool",
  "net.proxy_manager",
  "net.bounded",
  "acquisition",
  "acquisition.channels",
  "acquisition.config",
  "acquisition.crawler.base",
  "acquisition.markets.quote_router",
  "acquisition.markets.sectors",
  "acquisition.markets.northbound",
  "acquisition.markets.index_klines",
  "acquisition.markets.stock_news",
  "acquisition.markets.finnhub_news",
  # 域3 data_engine
  "data_engine.base_job",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network and not integration'"
markers = [
  "network: 真实出网（akshare/东财/yfinance/pytdx），默认不跑",
  "integration: 依赖本地服务（:8000/:8002）或真实库，默认不跑",
  "baseline: 13.1 行为基线特征测试",
]
