# backend 工具链单一配置源（ruff / mypy / pytest）。
# 见 docs/CODING_STANDARDS.md §10。运行环境是 conda env `quant`（Python 3.10）。

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["**/__pycache__", "scripts/data", "data", "venv", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# B008: FastAPI 的 Depends()/Query() 作默认值是框架惯例，不是 bugbear 说的那种坑
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
  "advisor_engine", "agents", "alpha_lab", "analysis_engine", "api", "automation",
  "backtest_engine", "cockpit_engine", "common", "data_engine", "knowledge_engine",
  "limit_up_engine", "net", "news_engine", "notify", "orderbook", "portfolio",
  "prediction_engine", "recommend_engine", "report_engine", "review",
  "screener_engine", "services", "strategy", "trading_engine",
]

# ── 存量豁免基线（只减不增）─────────────────────────────────────────────
# 由 `ruff check . --output-format=json` 机器生成：每个文件只豁免它当下真实违反
