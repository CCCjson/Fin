<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fin 量化 · 启动中</title>
  <style>
    :root { --neon: #00FF9C; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0e14;
      color: #cbd5e1;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
    }
    .logo { font-size: 30px; font-weight: 700; letter-spacing: 2px; color: var(--neon); }
    .logo small { color: #64748b; font-weight: 400; font-size: 14px; margin-left: 8px; letter-spacing: 0; }
    .ring {
      width: 46px; height: 46px;
      border: 3px solid rgba(0,255,156,0.15);
      border-top-color: var(--neon);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #94a3b8; min-height: 20px; }
    .hint { font-size: 12px; color: #475569; }
    .steps { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #64748b; }
    .steps .row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; flex: none; }
    .dot.ok { background: var(--neon); box-shadow: 0 0 6px var(--neon); }
    .dot.wait { background: #eab308; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    .err { color: #f87171; font-size: 13px; text-align: center; max-width: 420px; line-height: 1.6; }
    button {
      margin-top: 8px; padding: 8px 20px; font-size: 13px;
      background: var(--neon); color: #06251a; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Fin<small>量化交易系统</small></div>
    <div class="ring" id="ring"></div>
    <div class="status" id="status">正在启动本地服务…</div>
    <div class="steps">
      <div class="row"><span class="dot wait" id="dot-be"></span><span>后端引擎 (:8000) — 数据/AI/回测</span></div>
      <div class="row"><span class="dot wait" id="dot-fe"></span><span>前端界面 (:5174)</span></div>
    </div>
    <div class="hint" id="hint">首次冷启动约需 20–40 秒预热，请稍候…</div>
    <div class="err hidden" id="err"></div>
    <button class="hidden" id="retry">重试</button>
  </div>

  <script>
    const FRONTEND_URL = "http://127.0.0.1:5174";
    const BACKEND_DOCS = "http://127.0.0.1:8000/docs";
    const MAX_WAIT_MS = 120000;   // 最长等待 2 分钟
    const POLL_MS = 1000;

    const $ = (id) => document.getElementById(id);
    const setDot = (el, cls) => { el.className = "dot " + cls; };

    // 后端：CORS 已放开(*), 直接读 200
    async function backendUp() {
      try {
        const r = await fetch(BACKEND_DOCS, { cache: "no-store" });
        return r.status === 200;
      } catch { return false; }
    }
    // 前端 vite dev 无 CORS 头，用 no-cors 探可达性（连得上即 resolve，拒绝则 throw）
    async function frontendUp() {
      try {
        await fetch(FRONTEND_URL + "/", { mode: "no-cors", cache: "no-store" });
        return true;
      } catch { return false; }
    }

    async function boot() {
      $("err").classList.add("hidden");
      $("retry").classList.add("hidden");
      $("ring").classList.remove("hidden");
      const start = performance.now();
      let beOk = false, feOk = false;

      while (performance.now() - start < MAX_WAIT_MS) {
        if (!beOk) { beOk = await backendUp(); if (beOk) setDot($("dot-be"), "ok"); }
        if (!feOk) { feOk = await frontendUp(); if (feOk) setDot($("dot-fe"), "ok"); }

        if (beOk && feOk) {
          $("status").textContent = "就绪，正在进入…";
          setTimeout(() => { window.location.href = FRONTEND_URL; }, 300);
          return;
        }
        const waiting = [!beOk && "后端", !feOk && "前端"].filter(Boolean).join(" / ");
        $("status").textContent = "等待 " + waiting + " 就绪…";
        await new Promise((r) => setTimeout(r, POLL_MS));
      }

      // 超时
      $("ring").classList.add("hidden");
      $("status").textContent = "";
      $("err").textContent = "服务启动超时。请检查后端日志：/tmp/fin-backend.log；确认 conda 环境 quant 可用、端口 8000/5174 未被占用。";
      $("err").classList.remove("hidden");
      $("retry").classList.remove("hidden");
    }

    $("retry").addEventListener("click", boot);
    boot();
  </script>
</body>
</html>
